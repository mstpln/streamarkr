name: Apply v0.18 same-origin build

on:
  push:
    branches: [feat/same-origin-worker-hosting-v0180]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'mstpln/streamarkr' && github.ref == 'refs/heads/feat/same-origin-worker-hosting-v0180'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/same-origin-worker-hosting-v0180
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply focused build
        run: node scripts/apply-v0180-build.mjs
      - name: Install development tools
        run: npm ci --no-audit --no-fund
      - name: Validate same-origin build
        run: |
          npm run build:cloudflare
          npm test
          npm run test:d1
          npm run test:d1:wrangler
      - name: Commit validated build and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v0180.yml scripts/apply-v0180-build.mjs
          git add -A
          git commit -m "Add same-origin Worker hosting (v0.18.0)"
          git push origin HEAD:feat/same-origin-worker-hosting-v0180
