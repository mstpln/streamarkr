name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install development tools
        run: npm ci --no-audit --no-fund
      - name: Build PWA
        run: npm run build
      - name: Type-check Worker
        run: npm run build:worker
      - name: Logic, repository, Worker and client tests
        run: npm test
      - name: Validate D1 migration semantics
        run: npm run test:d1
      - name: Validate migration in Wrangler local D1
        run: npm run test:d1:wrangler

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install development tools
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start synthetic app
        run: |
          node server.mjs 8787 > /tmp/streamarkr-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamarkr-server.log
          exit 1
      - name: Browser and responsive QA
        env:
          QA_BASE_URL: http://127.0.0.1:8787
        run: npm run qa:browser
