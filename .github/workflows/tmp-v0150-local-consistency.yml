name: Temporary v0.15.0 local consistency

on:
  push:
    branches: [feat/backend-user-state-v0150]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/backend-user-state-v0150
      - name: Apply consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing marker in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          once('src/lib/repo.ts',
               "  await db.put('watched_service', { titleId, serviceKey, changedAt: new Date().toISOString() } satisfies WatchedService);",
               """  const service = await db.get<ServiceDef>('services', serviceKey);
            if (!service) throw new Error(`Unknown streaming service: ${serviceKey}`);
            if (!service.userSelected) throw new Error(`Streaming service is not selected: ${serviceKey}`);
            await db.put('watched_service', { titleId, serviceKey, changedAt: new Date().toISOString() } satisfies WatchedService);""")

          once('src/ui/screens/detail.ts',
               "${services.filter((service) => service.userSelected).map((service) => `<option value=\"${escapeHtml(service.serviceKey)}\" ${watchedService?.serviceKey === service.serviceKey ? 'selected' : ''}>${escapeHtml(service.displayName)}</option>`).join('')}",
               """${services.filter((service) => service.userSelected || watchedService?.serviceKey === service.serviceKey).map((service) => {
            const historicalOnly = watchedService?.serviceKey === service.serviceKey && !service.userSelected;
            return `<option value=\"${escapeHtml(service.serviceKey)}\" ${watchedService?.serviceKey === service.serviceKey ? 'selected' : ''} ${historicalOnly ? 'disabled' : ''}>${escapeHtml(service.displayName)}${historicalOnly ? ' · Not currently selected' : ''}</option>`;
          }).join('')}
          ${watchedService && !services.some((service) => service.serviceKey === watchedService.serviceKey) ? `<option value=\"${escapeHtml(watchedService.serviceKey)}\" selected disabled>${escapeHtml(watchedService.serviceKey)} · Historical service</option>` : ''}""")

          once('browser-qa.mjs',
               "      await mod.setWatchedService(seriesEvent.titleId, custom.serviceKey);\n      return { titleId: seriesEvent.titleId, serviceKey: custom.serviceKey };",
               "      await mod.setWatchedService(seriesEvent.titleId, custom.serviceKey);\n      await mod.setServiceSelected(custom.serviceKey, false);\n      return { titleId: seriesEvent.titleId, serviceKey: custom.serviceKey };")
          once('browser-qa.mjs',
               "record('Detail escapes custom streaming-service text', detailCustomServiceSafe);",
               "record('Detail preserves and escapes a deselected historical streaming service', detailCustomServiceSafe);")

          once('tests/repo-integration.test.ts',
               "  it('buildExportPayload (Correction 14) includes every user-owned data category', async () => {",
               """  it('watched-service writes require a selected service but historical values survive later deselection', async () => {
            await repo.resetToFixtures();
            const id = F.TITLES[0].id;
            await repo.setServiceSelected('netflix', false);
            let threw = false;
            try {
              await repo.setWatchedService(id, 'netflix');
            } catch {
              threw = true;
            }
            expect(threw).toBe(true);
            expect((await repo.allWatchedService()).some((row) => row.titleId === id && row.serviceKey === 'netflix')).toBe(false);

            await repo.setServiceSelected('netflix', true);
            await repo.setWatchedService(id, 'netflix');
            await repo.setServiceSelected('netflix', false);
            expect((await repo.allWatchedService()).some((row) => row.titleId === id && row.serviceKey === 'netflix')).toBe(true);
          });

          it('buildExportPayload (Correction 14) includes every user-owned data category', async () => {""")
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/repo.ts src/ui/screens/detail.ts browser-qa.mjs tests/repo-integration.test.ts
          git commit -m "Align watched-service history semantics"
          git push
