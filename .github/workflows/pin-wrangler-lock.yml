name: Pin Wrangler lockfile

on:
  push:
    branches:
      - feat/wrangler-local-d1-v0120
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/wrangler-local-d1-v0120
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile for pinned Wrangler
        run: npm install --save-dev --save-exact wrangler@4.129.0 --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git diff --exit-code -- package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "Lock Wrangler 4.129.0 dependencies"
          git push origin HEAD:feat/wrangler-local-d1-v0120
