name: Temporary v0.15.0 final hardening

on:
  push:
    branches: [feat/backend-user-state-v0150]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/backend-user-state-v0150
      - name: Apply final review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing marker in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          # Repository-boundary invariants.
          once('worker/repository.ts',
               "export class MissingEpisodeError extends Error {",
               """export class UnselectedServiceError extends Error {
            constructor(serviceKey: string) {
              super(`Streaming service is not selected: ${serviceKey}`);
              this.name = 'UnselectedServiceError';
            }
          }

          export class InvalidCustomServiceNameError extends Error {
            constructor() {
              super('Invalid custom streaming service name');
              this.name = 'InvalidCustomServiceNameError';
            }
          }

          export class MissingEpisodeError extends Error {""")
          once('worker/repository.ts',
               "async function requireEpisode(db: D1Database, titleId: string, seasonNumber: number, episodeNumber: number): Promise<void> {",
               """async function requireSelectedService(db: D1Database, serviceKey: string): Promise<void> {
            const service = await db.prepare('SELECT user_selected FROM services WHERE service_key = ?')
              .bind(serviceKey).first<{ user_selected: number }>();
            if (!service) throw new MissingServiceError(serviceKey);
            if (integer(service.user_selected) !== 1) throw new UnselectedServiceError(serviceKey);
          }

          async function requireEpisode(db: D1Database, titleId: string, seasonNumber: number, episodeNumber: number): Promise<void> {""")
          once('worker/repository.ts',
               "  await requireService(db, serviceKey);\n  await run(db, `INSERT INTO watched_service",
               "  await requireSelectedService(db, serviceKey);\n  await run(db, `INSERT INTO watched_service")
          once('worker/repository.ts',
               "  const trimmed = displayName.trim();\n  const serviceKey = trimmed.toLowerCase()",
               "  const trimmed = displayName.trim();\n  if (!trimmed || trimmed.length > 80 || !/[a-z0-9]/i.test(trimmed)) throw new InvalidCustomServiceNameError();\n  const serviceKey = trimmed.toLowerCase()")
          once('worker/repository.ts',
               "  if (!serviceKey) throw new Error('Invalid custom service key');",
               "  if (!serviceKey || serviceKey.length > 80) throw new InvalidCustomServiceNameError();")
          once('worker/repository.ts', '.toLocaleLowerCase()', '.toLowerCase()')
          once('worker/repository.ts', '.toLocaleLowerCase()', '.toLowerCase()')

          # HTTP layer: safe integers plus controlled domain errors.
          once('worker/index.ts', "  InvalidOverrideScopeError,", "  InvalidCustomServiceNameError,\n  InvalidOverrideScopeError,")
          once('worker/index.ts', "  setWatchedService\n} from './repository.js';", "  setWatchedService,\n  UnselectedServiceError\n} from './repository.js';")
          once('worker/index.ts', 'return Number.isInteger(value) && Number(value) > 0;', 'return Number.isSafeInteger(value) && Number(value) > 0;')
          once('worker/index.ts', 'return Number.isInteger(value) && Number(value) >= 0;', 'return Number.isSafeInteger(value) && Number(value) >= 0;')
          once('worker/index.ts',
               "    if (error instanceof MissingEpisodeError) {",
               """    if (error instanceof UnselectedServiceError) {
              return json({ error: 'service_not_selected', message: error.message }, 409, responseHeaders);
            }
            if (error instanceof InvalidCustomServiceNameError) {
              return json({ error: 'invalid_service_name' }, 400, responseHeaders);
            }
            if (error instanceof MissingEpisodeError) {""")

          # Route-test fake D1 selection state.
          once('tests/worker-routes.test.ts',
               "    if (this.sql.includes('SELECT service_key FROM services')",
               """    if (this.sql.includes('SELECT user_selected FROM services')) {
              const serviceKey = String(this.values[0]);
              if (!this.db.knownServices.has(serviceKey)) return null;
              return { user_selected: this.db.selectedServices.has(serviceKey) ? 1 : 0 } as T;
            }
            if (this.sql.includes('SELECT service_key FROM services')""")
          once('tests/worker-routes.test.ts',
               "  knownServices = new Set(['netflix', 'hbo-max']);",
               "  knownServices = new Set(['netflix', 'hbo-max']);\n  selectedServices = new Set(['netflix', 'hbo-max']);")
          once('tests/worker-routes.test.ts',
               "test('movie and episode override routes validate scope and persist durable corrections', async () => {",
               """test('watched-service writes require a currently selected service', async () => {
            const db = new FakeDb();
            db.knownServices.add('viaplay');
            const response = await handleRequest(new Request('https://worker.example/api/watched-service/movie-1', {
              method: 'PUT', headers: authHeaders({ 'content-type': 'application/json' }), body: JSON.stringify({ serviceKey: 'viaplay' })
            }), env(db));
            assert.equal(response.status, 409);
            assert.equal((await response.json() as any).error, 'service_not_selected');
            assert.equal(db.writes.length, 0);
          });

          test('movie and episode override routes validate scope and persist durable corrections', async () => {""")
          once('tests/worker-routes.test.ts',
               "test('override routes reject media-type scope mismatches before touching D1', async () => {",
               """test('override routes reject unsafe integer coordinates before touching D1', async () => {
            const unsafe = Number.MAX_SAFE_INTEGER + 1;
            const episodeDb = new FakeDb();
            const episode = await handleRequest(new Request('https://worker.example/api/overrides/episode/series-1', {
              method: 'PUT', headers: authHeaders({ 'content-type': 'application/json' }),
              body: JSON.stringify({ seasonNumber: unsafe, episodeNumber: 1, state: 'watched' })
            }), env(episodeDb));
            assert.equal(episode.status, 400);
            assert.equal(episodeDb.touched, 0);

            const seasonDb = new FakeDb();
            const season = await handleRequest(new Request('https://worker.example/api/overrides/season/series-1', {
              method: 'PUT', headers: authHeaders({ 'content-type': 'application/json' }),
              body: JSON.stringify({ seasonNumber: unsafe, state: 'watched' })
            }), env(seasonDb));
            assert.equal(season.status, 400);
            assert.equal(seasonDb.touched, 0);
          });

          test('override routes reject media-type scope mismatches before touching D1', async () => {""")

          # Repository-test fake D1 selection state and direct-boundary regressions.
          once('tests/worker-repository.test.ts',
               "    if (this.sql.includes('SELECT service_key FROM services')",
               """    if (this.sql.includes('SELECT user_selected FROM services')) {
              const serviceKey = String(this.values[0]);
              if (!this.db.knownServices.has(serviceKey)) return null;
              return { user_selected: this.db.selectedServices.has(serviceKey) ? 1 : 0 } as T;
            }
            if (this.sql.includes('SELECT service_key FROM services')""")
          once('tests/worker-repository.test.ts',
               "  knownServices = new Set<string>();",
               "  knownServices = new Set<string>();\n  selectedServices = new Set<string>();")
          once('tests/worker-repository.test.ts',
               "  db.knownServices.add('netflix');\n  await setWatchedService(db, 'movie-1', 'netflix', '2026-09-07T00:00:00Z');",
               """  db.knownServices.add('netflix');
            await assert.rejects(() => setWatchedService(db, 'movie-1', 'netflix', '2026-09-07T00:00:00Z'), /not selected/);
            assert.equal(db.writes.length, 0);
            db.selectedServices.add('netflix');
            await setWatchedService(db, 'movie-1', 'netflix', '2026-09-07T00:00:00Z');""")
          once('tests/worker-repository.test.ts',
               "test('adding the same normalized service reselects it but a different-name collision is rejected', async () => {",
               """test('custom-service repository refuses unaddressable or oversized names', async () => {
            const db = new RecordingDb();
            await assert.rejects(() => addCustomService(db, 'A'.repeat(81)), /Invalid custom streaming service name/);
            await assert.rejects(() => addCustomService(db, '!!!'), /Invalid custom streaming service name/);
            assert.equal(db.writes.length, 0);
          });

          test('adding the same normalized service reselects it but a different-name collision is rejected', async () => {""")
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts worker/repository.ts tests/worker-routes.test.ts tests/worker-repository.test.ts
          git commit -m "Harden durable user-state input invariants"
          git push
