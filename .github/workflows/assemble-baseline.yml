name: Assemble Streamarkr baseline

on:
  push:
    branches:
      - feat/establish-streamarkr-baseline-v0102

permissions:
  contents: write

jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[assemble baseline]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/establish-streamarkr-baseline-v0102
      - name: Validate and assemble reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk* > /tmp/streamarkr-baseline.tar.xz
          xz -t /tmp/streamarkr-baseline.tar.xz
          tar -tJf /tmp/streamarkr-baseline.tar.xz >/dev/null
          tar -xJf /tmp/streamarkr-baseline.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/assemble-baseline.yml
          rm -f .github/workflows/bootstrap-upload.yml
          rm -f .github/workflows/bootstrap-baseline.yml
      - name: Commit reviewed baseline source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish Streamarkr v0.10.2 reviewed baseline"
          git push origin HEAD:feat/establish-streamarkr-baseline-v0102
