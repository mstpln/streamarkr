name: Temporary v0.15.0 formatting cleanup

on:
  push:
    branches: [feat/backend-user-state-v0150]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/backend-user-state-v0150
      - name: Clean generated test formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          old = """    if (this.sql.includes('SELECT user_selected FROM services')) {
    const serviceKey = String(this.values[0]);
    if (!this.db.knownServices.has(serviceKey)) return null;
    return { user_selected: this.db.selectedServices.has(serviceKey) ? 1 : 0 } as T;
  }
  if (this.sql.includes('SELECT service_key FROM services') && this.db.knownServices.has(String(this.values[0]))) return { service_key: String(this.values[0]) } as T;
"""
          new = """    if (this.sql.includes('SELECT user_selected FROM services')) {
      const serviceKey = String(this.values[0]);
      if (!this.db.knownServices.has(serviceKey)) return null;
      return { user_selected: this.db.selectedServices.has(serviceKey) ? 1 : 0 } as T;
    }
    if (this.sql.includes('SELECT service_key FROM services') && this.db.knownServices.has(String(this.values[0]))) return { service_key: String(this.values[0]) } as T;
"""

          for path in ['tests/worker-routes.test.ts', 'tests/worker-repository.test.ts']:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing formatting marker in {path}')
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/worker-routes.test.ts tests/worker-repository.test.ts
          git commit -m "Clean generated test formatting"
          git push
